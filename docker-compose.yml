# Local full-stack for development: the FastAPI backend + a Qdrant instance.

services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      # Override any cloud QDRANT_URL from .env so we talk to the local instance.
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
    env_file:
      - path: backend/.env
        required: false
    depends_on:
      - qdrant
      - redis

volumes:
  qdrant_storage:
